services:
  qwen-local-service:
    build:
      context: ../..
      dockerfile: resources/local-service-qwen/Dockerfile.vllm
    image: justsay-qwen-local-vllm:dev
    container_name: justsay-qwen-local-vllm
    gpus: all
    ipc: host
    shm_size: "4gb"
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      JUSTSAY_LOCAL_SERVICE_HOST: 0.0.0.0
      JUSTSAY_LOCAL_SERVICE_PORT: "8765"
      JUSTSAY_LOCAL_SERVICE_MODEL: Qwen/Qwen3-ASR-1.7B
      JUSTSAY_LOCAL_SERVICE_RUNTIME_FAMILY: qwen3-asr
      JUSTSAY_QWEN_BACKEND: vllm
      JUSTSAY_QWEN_GPU_MEMORY_UTILIZATION: "0.55"
      JUSTSAY_QWEN_MAX_MODEL_LEN: "8192"
      JUSTSAY_QWEN_MAX_NEW_TOKENS: "32"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  huggingface-cache:
